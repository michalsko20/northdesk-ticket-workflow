name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose --profile test build tests
      - name: Lint, type-check and test without network
        run: docker compose --profile test run --rm --no-deps tests
